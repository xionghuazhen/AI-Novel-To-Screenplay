    emotion: 坚毅执着
  - speaker: char_001
    content: 前世我急于求成，这一世，每一步都要踩实了走。
    subtext: 反思前世教训，决定稳扎稳打
    emotion: 沉稳内省
  - speaker: char_001
    content: 等着吧，青云宗，只是我的起点。
    subtext: 心怀更广阔的天地，目标早已超越宗门
    emotion: 傲然自信
