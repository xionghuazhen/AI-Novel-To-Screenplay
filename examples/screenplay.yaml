    content: 真的是二十年前的自己……
    subtext: 通过镜中影像彻底确认重生时间点
    emotion: 感慨中带着笃定
  - speaker: char_001
    content: 上一世，我林凡陨落于天道之手。这一世，我定要逆天改命！
    subtext: 回忆陨落画面激发复仇与抗争意志
    emotion: 悲愤转为决然
  - speaker: char_001
    content: 欠我的，我会百倍讨回。护我的，我必万倍偿还。
    subtext: 立下重誓，明确这一世的行为准则
    emotion: 冷酷而坚定
